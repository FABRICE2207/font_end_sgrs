<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Lien bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />

    <!-- Lien css -->
    <style>
      .logo {
        padding: 10px;
        display: flex;
        gap: 20px;
      }
      .logo .texte {
        color: white;
        text-align: center;
        width: 100%;
      }

      .logo .texte h2 {
        font-weight: bold;
        line-height: 70px;
        font-size: 2rem;
      }

      #header-bg {
        background-color: #000759;
      }

      /* formulaire */
      .tab{
        margin: 5%;
        padding: 5px;
        display: none;
      }

      .show {
        display: block;
      }

      /*  */
      .flex{
        /* display: -ms-flexbox; */
        display: flex;
        -ms-flex-wrap: wrap;
        flex-wrap: wrap;
        gap: 30px;
        margin-right: -15px;
      }

      .delete{
        text-decoration: none;
        display: inline-block;
        background-color: red;
        color: #fff;
        font-size: 1rem;
        font-weight: bold;
        width: 100px;
        height: 35px;
        color: #fff;
        /* margin-left: auto; */
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        /* margin-left: -20px; */
      }

      .add-col{
        margin-bottom: 20px;
      }

      .imp-group{
        margin-top: 20px;
      }
    </style>

    <title>SGRS</title>
  </head>
  <body>
    <div class="container-fluid" id="header-bg">
      <!-- logo ascc -->
      <div class="row logo">
        <div class="col-md-2">
          <a href="index.html">
            <img src="./images/logo_ascci.png" alt="Logo ascci" width="80" />
          </a>
        </div>
        <!-- Titre plateforme -->
        <div class="col-md-9 texte">
          <h2>Système de Gestion des Responsables Scouts</h2>
        </div>
      </div>
    </div>

    <!-- Formulaire -->
    <div class="container" 
        style="border-radius: 10px; box-shadow: 1px 2px 5px rgba(0, 0, 0, 0.37);"
        >
      <form action="#" id="msform">
        <!-- Etape 1 -->
        <div class="tab show">
          <h3 class="text-center">INFORMATIONS PERSONNELLES</h3>
          <div class="row">
            <div class="col-md-4">
             <label for="">Nom</label>
              <input type="text" name="nom" class="form-control"/>
            </div>
            <div class="col-md-4">
                <label for="">Prénoms</label>
              <input type="text" name="prenoms" class="form-control" />
            </div>
            <div class="col-md-4">
                <label for="">Date de naissance</label>
              <input type="date" name="data_nais" class="form-control" />
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
             <label for="">Email</label>
              <input type="email" name="email" class="form-control" />
            </div>
            <div class="col-md-6">
                <label for="">Téléphone</label>
              <input type="text" name="telephone" class="form-control" />
            </div>
          </div>

          <div class="row">
            <div class="col-md-4">
             <label for="">Poste actuel</label>
              <select name="poste_actuel" id="" class="form-control">
                <option value="">Choisir un poste</option>
                <option value="CM">CHEF DE MEUTE</option>
                <option value="CMA">CHEF DE MEUTE ADJOINT</option>
                <option value="ACM">ASSISTANT(E) CHEF DE MEUTE</option>
              </select>
            </div>
            <div class="col-md-4">
                <label for="">Unité rattaché</label>
                <select name="unite_ratt" id="" class="form-control">
                    <option value="">Choisir une unité</option>
                    <option value="MEUTE">MEUTE</option>
                    <option value="TROUPE">TROUPE</option>
                    <option value="GENERATION">GENERATION</option>
                    <option value="ROUTE">ROUTE</option>
                  </select>
            </div>
            <div class="col-md-4">
                <label for="">Photo</label>
                <input type="file" name="photo" class="form-control" />
            </div>
          </div>

        </div>

        <!-- Etape 2 -->
        <div class="tab">
          <h3 class="text-center">LES FORMATIONS SUIVIES</h3>
          <div class="row">
            <div class="col-md-3">
             <label for="">Intitulé</label>
              <input type="text" name="intitule" class="form-control" />
            </div>
            <div class="col-md-3">
                <label for="">Date de la formation</label>
              <input type="date" name="date_format" class="form-control" />
            </div>
            <div class="col-md-3">
                <label for="">Lieu</label>
              <input type="text" name="lieu_format" class="form-control" />
            </div>
            <div class="col-md-3">
                <label for="">Certificat obtenu</label>
              <input type="text" name="certi_format" class="form-control" />
            </div>
          </div>

            <!-- Ajouter une nouvelle ligne -->
           <div class="imp-group">

           </div>
        

           <!-- Btn ajouter une nouvelle ligne -->
           <div class="row" style="margin-top: 20px;">
               <div class="col">
                   <!-- <button class="btn btn-success add" style="background-color: #FF6B02; border-color: #FF6B02;">Ajouter nouvelle ligne</button> -->
               <a href="#" class="btn btn-success add" style="background-color: #FF6B02; border-color: #FF6B02;">Ajouter nouvelle ligne</a>
               </div>
           </div>
          
        </div>  
    

         <!-- Etape 3 -->
         <div class="tab">
            <h3 class="text-center">LES FONCTIONS OCCUPEES</h3>
            <div class="row">
              <div class="col-md-4">
               <label for="">Poste actuel</label>
               <select name="poste_actul" id="" class="form-control">
                   <option value="">Choisir votre poste actuel</option>
                   <option value="MEUTE">MEUTE</option>
                   <option value="TROUPE">TROUPE</option>
                   <option value="GENERATION">GENERATION</option>
                   <option value="ROUTE">ROUTE</option>
                 </select>
              </div>
              <div class="col-md-4">
                  <label for="">Période</label>
                <input type="date" class="form-control" />
              </div>
              <div class="col-md-4">
                  <label for="">Unité/équipe concernée</label>
                  <select name="unite_equip" id="" class="form-control">
                      <option value="">Choisir une unité</option>
                      <option value="MEUTE">MEUTE</option>
                      <option value="TROUPE">TROUPE</option>
                      <option value="GENERATION">GENERATION</option>
                      <option value="ROUTE">ROUTE</option>
                      <option value="EN">EQUIPE NATIONALE</option>
                      <option value="ER">EQUIPE REGIONALE</option>
                      <option value="ED">EQUIPE DU DISTRICT</option>
                    </select>
              </div>
            </div>
          </div>

          <!-- Etape 4 -->
         <div class="tab">
            <h3 class="text-center">MOT DE PASSE</h3>
            <div class="row">
              <div class="col-md-6">
               <label for="">Mot de passe</label>
                <input type="password" name="password" class="form-control" />
              </div>
              <div class="col-md-6">
                  <label for="">Confirmation du mot de passe</label>
                <input type="password" name="password_confir" class="form-control" />
              </div>
            </div>
        </div>
        
        <!-- Les boutons -->
        <div class="row" id="btn" style="padding: 15px;">
            <div class="col" style="display: flex; justify-content: space-between;">
                <button type="button" class="btn btn-outline-success prev">Précédent</button>
                <button type="button" class="btn btn-success next">Suivant</button>
            </div>
         </div>
      </form>
    </div>

    <!-- Lien js -->
    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
      crossorigin="anonymous"
    ></script>

    <!-- Form etape  -->
     <script src="./js/form_multip.js"></script>
  </body>
</html>
