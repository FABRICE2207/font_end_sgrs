<!DOCTYPE html>
<html lang="en">
  <head>
    <title>ASCCI : SGRS</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" href="./images/logo_ascci.png" type="image/x-icon">
    <!-- Lien bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />

    <!-- Lien css -->
    <style>
      .logo {
        padding: 10px;
        display: flex;
        gap: 20px;
      }
      .logo .texte {
        color: white;
        text-align: center;
        width: 100%;
      }

      .logo .texte h2 {
        font-weight: bold;
        line-height: 70px;
        font-size: 2rem;
      }

      #header-bg {
        background-color: #000759;
      }

      /* formulaire */
      .tab{
        margin: 5%;
        padding: 5px;
        display: none;
      }

      .show {
        display: block;
      }

      /*  */
      .flex{
        /* display: -ms-flexbox; */
        display: flex;
        -ms-flex-wrap: wrap;
        flex-wrap: wrap;
        gap: 30px;
        margin-right: -15px;
      }

      .delete{
        text-decoration: none;
        display: inline-block;
        background-color: red;
        color: #fff;
        font-size: 1rem;
        font-weight: bold;
        width: 100px;
        height: 35px;
        color: #fff;
        /* margin-left: auto; */
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        /* margin-left: -20px; */
      }

      .add-col{
        margin-bottom: 20px;
      }

      .btn_enr{
        color: #ff6b02;
        font-weight: bold;
      }

      .btn_enr:hover{
        color: #000;
        text-decoration: none;
      }

      .mdp_oubl{
        color: black;
        text-align: right;
        text-decoration: none;
      }
      .mdp_oubl:hover{
        color: black;
        text-decoration: none;
      }
      @media (min-width: 600px) {
        #connexion {
           width: 30%;
        }
      }

       @media (max-width: 600px) {
        #connexion {
           width: 100%;
        }
      }
    </style>

    <title>SGRS</title>
  </head>
  <body>
    <div class="container-fluid" id="header-bg">
      <!-- logo ascc -->
      <div class="row logo">
        <div class="col-md-2">
          <a href="index.html">
            <img src="./images/logo_ascci.png" alt="Logo ascci" width="80" />
          </a>
        </div>
        <!-- Titre plateforme -->
        <div class="col-md-9 texte">
          <h2>Système de Gestion des Responsables Scouts</h2>
        </div>
      </div>
    </div>

    <!-- Formulaire -->
    <div class="container" 
        style="border-radius: 10px; box-shadow: 1px 2px 5px rgba(0, 0, 0, 0.37);margin-top: 5%;"
        >
      <form action="#" id="msform">
        <!-- Etape 1 -->
        <div class="tab">
          <h3 class="text-center">MOT DE PASSE OUBLIE</h3>
          <div class="row">
             <label for="">Nouveau mot de passe</label>
              <input type="password" name="password" class="form-control"/>
          </div>

          <div class="row">
           <label for="">Confirmation du mot de passe</label>
             <input type="password" name="password" class="form-control"/>
         </div>

         <!-- <div class="row">
            <div class="col" style="text-align: right;">
                <a href="" class="mdp_oubl">Mot de passe oublié</a>
            </div>
         </div> -->

          <div class="row" style="margin-top: 20px;margin-bottom: 20px;">
            <!-- <button type="button" class="btn btn-success next">Suivant</button> -->
            <a href="connexion.html" type="submit" class="btn btn-success btn-lg btn-block">Modifier</a>
          </div>

          <div class="row" style="margin-top: 20px;margin-bottom: 20px;">
            <!-- <button type="button" class="btn btn-success next">Suivant</button> -->
            <a href="connexion.html" type="submit" class="btn btn-outline-success btn-lg btn-block">Se connecter</a>
          </div>

          <!-- Btn s'enregistrer -->
          <div class="row">
            <div class="col">
                N’avez-vous pas un compte ? <a href="form_enregistement.html" class="btn_enr">S'enregistrer</a>
            </div>
         </div>

          <!-- <div class="row">
            <div class="col" style="text-align: center;">
                <a href="index.html" class="mdp_oubl">Retour</a>
            </div>
         </div> -->
        </div>

       
      </form>
    </div>

    <!-- Lien js -->
    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
      crossorigin="anonymous"
    ></script>

    <!-- Form etape  -->
     <script src="./js/form_multip.js"></script>
  </body>
</html>
