<!DOCTYPE html>
<html lang="en">
  <head>
    <title>ASCCI : SGRS</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" href="./images/logo_ascci.png" type="image/x-icon">
    <!-- Lien bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />

    <!-- Lien css -->
    <link rel="stylesheet" href="css/style.css" />
    
  </head>
  <body>
    <div class="container-fluid">
      <!-- logo ascc -->
      <div class="logo">
        <img src="./images/logo_ascci.png" alt="Logo ascci" width="80" />
      </div>

      <!-- Texte -->
      <div class="texte">
        <div>
          <h1>Système de Gestion des Responsables Scouts</h1>
        </div>

        <!-- Les deux boutons -->
        <div class="row bouton">
          <div>
            <a href="form_enregistement.html" class="btn btn-success"
              >Je m'enregistre</a
            >
          </div>
          <div>
            <!-- Btn modal -->
            <a
              href="compte_respo.html"
              type="button"
              class="btn btn-primary"
              data-toggle="modal"
              data-target="#exampleModal"
              style="background-color: #ff6b02; border-color: #ff6b02"
              >Je me connecte</a
            >
          </div>
        </div>
      </div>

      <!-- Modal -->
      <div
        class="modal fade"
        id="exampleModal"
        tabindex="-1"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h2 class="modal-title" id="exampleModalLabel">Entre ton matricule</h2>
              <!-- <button
                type="button"
                class="close"
                data-dismiss="modal"
                aria-label="Close"
              >
                <span aria-hidden="true">&times;</span> -->
              </button>
            </div>
            <div class="modal-body">
                <form action="">
                    <div class="container">
                        <input type="text" name="matricule" placeholder="Entre ton matricule" class="form-control">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-success">
                    Se connecter
                </button>
              <button
                type="button"
                class="btn btn-secondary"
                data-dismiss="modal"
              >
                Annuler
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Lien js -->
    <script
      src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"
      integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
