  <body>
    <div class="container-fluid" id="header-bg">
      <!-- logo ascc -->
      <div class="row logo">
        <div class="col-md-2">
          <a href="index.html">
            <img src="./images/logo_ascci.png" alt="Logo ascci" width="80" />
          </a>
        </div>
        <!-- Titre plateforme -->
        <div class="col-md-9 texte">
          <h2>Système de Gestion des Responsables Scouts</h2>
        </div>
      </div>
    </div>
    <!-- Nom du chef et btn imprimer et se doconnecter -->
    <div class="container" 
        style="margin-top: 20px; padding: 10px; border-radius: 10px; box-shadow: 1px 2px 5px rgba(0, 0, 0, 0.37);"
        >
        <div class="row">
            <div class="col-md-8">
                <!-- Affiche son nom -->
                <h3>CHEF(FE) KOUAME SERGE </h3>
            </div>
            <div class="col-md-4">
                <div class="row">
                    <!-- Bouton imprimer le cv -->
                    <div class="col" style="display: flex; justify-content: flex-end; gap: 15px;">
                        <button class="btn btn-success">
                            <i class="fa-solid fa-print"></i>
                            J'imprime mon cv
                        </button>
                        <!-- Bouton se déconnecter -->
                        <a href="connexion.html" class="btn btn-danger">
                            <i class="fa-solid fa-right-from-bracket"></i>
                            Se deconnecter
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Formulaire -->
    <div class="container" 
        style="border-radius: 10px; box-shadow: 1px 2px 5px rgba(0, 0, 0, 0.37);"
        >
      <form action="#">
        <!-- Etape 1 -->
        <div class="tab">
          <h3 class="text-center">INFORMATIONS PERSONNELLES</h3>
          <div class="row">
            <!-- Photo du chef -->
            <div class="col-md-3">
                <div class="row">
                    <div class="card">
                        <img src="./images/cn_serge.jpg" alt="photo chef" class="photo_chef">
                    </div>
                </div>
                <div class="row">
                    <label for="">Photo</label>
                    <input type="file" name="photo" class="form-control" />
                </div>
            </div>
            <div class="col-md-9" style="margin-top: 34px;">
                <div class="row">
                    <div class="col-md-4">
                        <label for="">Nom</label>
                         <input type="text" name="nom" class="form-control"/>
                       </div>
                       <div class="col-md-4">
                           <label for="">Prénoms</label>
                         <input type="text" name="prenoms" class="form-control" />
                       </div>
                       <div class="col-md-4">
                           <label for="">Date de naissance</label>
                         <input type="date" name="data_nais" class="form-control" />
                       </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                     <label for="">Email</label>
                      <input type="email" name="email" class="form-control" />
                    </div>
                    <div class="col-md-6">
                        <label for="">Téléphone</label>
                      <input type="text" name="telephone" class="form-control" />
                    </div>
                </div>
        
                <div class="row">
                    <div class="col-md-6">
                     <label for="">Poste actuel</label>
                      <select name="poste_actuel" id="" class="form-control">
                        <option value="">Choisir un poste</option>
                        <option value="CM">CHEF DE MEUTE</option>
                        <option value="CMA">CHEF DE MEUTE ADJOINT</option>
                        <option value="ACM">ASSISTANT(E) CHEF DE MEUTE</option>
                      </select>
                    </div>
                    <div class="col-md-6">
                        <label for="">Unité rattaché</label>
                        <select name="unite_ratt" id="" class="form-control">
                            <option value="">Choisir une unité</option>
                            <option value="MEUTE">MEUTE</option>
                            <option value="TROUPE">TROUPE</option>
                            <option value="GENERATION">GENERATION</option>
                            <option value="ROUTE">ROUTE</option>
                          </select>
                    </div>
                </div>
            </div>
          </div>
        </div>

        <!-- Etape 2 -->
        <div class="tab">
          <h3 class="text-center">LES FORMATIONS SUIVIES</h3>
          
            <!-- Btn ajouter une nouvelle ligne -->
           <div class="row" style="margin-top: 20px;">
               <div class="col">
                   <!-- <button class="btn btn-success add" style="background-color: #FF6B02; border-color: #FF6B02;">
                    &plus;
                   </button> -->
               <a href="#" class="btn btn-success add" style="background-color: #FF6B02; border-color: #FF6B02;">
                <i class="fa fa-plus"></i>
               </a>
               </div>
           </div>

          <div class="row" style="margin-top: 10px;margin-bottom: 10px;">
            <div class="col-md-3">
             <label for="">Intitulé</label>
              <input type="text" name="intitule" class="form-control" />
            </div>
            <div class="col-md-3">
                <label for="">Date de la formation</label>
              <input type="date" name="date_format" class="form-control" />
            </div>
            <div class="col-md-3">
                <label for="">Lieu</label>
              <input type="text" name="lieu_format" class="form-control" />
            </div>
            <div class="col-md-3">
                <label for="">Certificat obtenu</label>
              <input type="text" name="certi_format" class="form-control" />
            </div>
          </div>

          <div class="row" style="margin-top: 10px;margin-bottom: 10px;" id="ligne">
            <div class="col-md-3">
              <input type="text" name="intitule" class="form-control"/>
            </div>
            <div class="col-md-3">
              <input type="date" name="date_format" class="form-control" />
            </div>
            <div class="col-md-3">
              <input type="text" name="lieu_format" class="form-control" />
            </div>
            <div class="col-md-3">
              <input type="text" name="certi_format" class="form-control" />
            </div>
          </div>

          <div class="row" style="margin-top: 10px;margin-bottom: 10px;" id="ligne">
            <div class="col-md-3">
              <input type="text" name="intitule" class="form-control" />
            </div>
            <div class="col-md-3">
              <input type="date" name="date_format" class="form-control" />
            </div>
            <div class="col-md-3">
              <input type="text" name="lieu_format" class="form-control" />
            </div>
            <div class="col-md-3">
              <input type="text" name="certi_format" class="form-control" />
            </div>
          </div>

          

            <!-- Ajouter une nouvelle ligne -->
           <div class="imp-group">

           </div>
          
        </div>  
    
         <!-- Etape 3 -->
         <div class="tab">
            <h3 class="text-center">LES FONCTIONS OCCUPEES</h3>
            <div class="row">
              <div class="col-md-4">
               <label for="">Poste actuel</label>
               <select name="poste_actul" id="" class="form-control">
                   <option value="">Choisir votre poste actuel</option>
                   <option value="MEUTE">MEUTE</option>
                   <option value="TROUPE">TROUPE</option>
                   <option value="GENERATION">GENERATION</option>
                   <option value="ROUTE">ROUTE</option>
                 </select>
              </div>
              <div class="col-md-4">
                  <label for="">Période</label>
                <input type="date" class="form-control" />
              </div>
              <div class="col-md-4">
                  <label for="">Unité/équipe concernée</label>
                  <select name="unite_equip" id="" class="form-control">
                      <option value="">Choisir une unité</option>
                      <option value="MEUTE">MEUTE</option>
                      <option value="TROUPE">TROUPE</option>
                      <option value="GENERATION">GENERATION</option>
                      <option value="ROUTE">ROUTE</option>
                      <option value="EN">EQUIPE NATIONALE</option>
                      <option value="ER">EQUIPE REGIONALE</option>
                      <option value="ED">EQUIPE DU DISTRICT</option>
                    </select>
              </div>
            </div>
         </div>
          
          <!-- <div class="container" style="border-radius: 10px; max-width: 50%;"
        > -->
            <!-- Etape 4 -->
          <div class="tab">
              <h3 class="text-center">MOT DE PASSE</h3>
              <div class="row">
                <div class="col-md-6">
                <label for="">Mot de passe</label>
                  <input type="password" name="password" class="form-control" />
                </div>
                <div class="col-md-6">
                    <label for="">Confirmation du mot de passe</label>
                  <input type="password" name="password_confir" class="form-control" />
                </div>
              </div>
              <!-- <div class="row">
                <div class="col-md-12">
                    <label for="">Confirmation du mot de passe</label>
                  <input type="password" name="password_confir" class="form-control" />
                </div>
              </div> -->
          </div>
        <!-- </div> -->
        
        <!-- Les boutons -->
        <div class="row" id="btn" style="padding-bottom: 20px;margin: 10px 0px;">
            <div class="col" style="display: flex; justify-content:flex-end;">
                <!-- <button type="button" class="btn btn-outline-success prev">Précédent</button> -->
                <button type="button" class="btn btn-outline-success next">Modifer</button>
            </div>
